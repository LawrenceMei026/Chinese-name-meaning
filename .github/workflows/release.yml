name: "Publish Release"

on:
  push:
    tags:
      - 'v*' # 当你推送以 v 开头的标签（如 v1.0.0）时触发

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest] # 我们目前专注 Windows .exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install build dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          choco install cmake llvm --installargs 'ADD_CMAKE_TO_PATH=System'
          refreshenv

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install frontend dependencies
        working-directory: my-vue-app
        run: npm ci

      - name: verify release version
        working-directory: my-vue-app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:version -- "$env:RELEASE_TAG"

      - name: verify feature contract
        working-directory: my-vue-app
        run: npm run test:features

      - name: run unit tests
        working-directory: my-vue-app
        run: npm run test:unit -- --run

      - name: run type check
        working-directory: my-vue-app
        run: npm run type-check

      - name: run read-only lint
        working-directory: my-vue-app
        run: npm run lint:check

      - name: smoke test ONNX model
        working-directory: my-vue-app
        run: npm run test:onnx

      - name: verify native Rust
        working-directory: my-vue-app/src-tauri
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          cargo fmt --check
          cargo check --locked
          cargo test --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Chinese Name Meaning ${{ github.ref_name }}"
          releaseBody: "See the assets below for the installable binaries."
          releaseDraft: true
          prerelease: false
          # 指定 tauri 项目的根目录
          projectPath: ./my-vue-app
